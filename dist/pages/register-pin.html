<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="../assets/css/main.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Red+Rose:wght@300..700&display=swap"
    rel="stylesheet" />
  <link rel="shortcut icon" href="../assets/images/wallet-white.png" type="image/x-icon" />
  <title>Register PIN</title>
</head>

<body>
  <div class="container max-w-3xl mx-auto">
    <div class="flex h-dvh flex-col items-center justify-center bg-blue-50 p-4">
      <div class="flex w-full flex-col">
        <!-- Ilustration -->
        <img src="../assets/images/register-pin.png" alt="ilustration" class="h-40 self-center" />
        <!-- ./ Ilustration -->

        <!-- Title + Description -->
        <div class="mt-8 mb-5 flex flex-col">
          <h1 class="text-center text-lg font-semibold text-gray-900">
            Buat 6 Digit PIN
          </h1>
          <p class="text-center text-xs font-medium text-gray-400">
            Buatlah 6 digit PIN untuk masuk lebih aman
          </p>
        </div>
        <!-- ./ Title + Description -->

        <!-- Form -->
        <form action="#" method="post" class="flex flex-col gap-4">
          <!-- Input Name -->
          <div class="flex flex-col gap-y-1.5">
            <div class="relative">
              <input id="my-input-text" type="text"
                class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:ring-2 focus:ring-blue-400 focus:outline-none focus:invalid:ring-red-900 disabled:border-gray-300 disabled:bg-gray-100"
                placeholder="6 Digit PIN" />
              <div
                class="text-icon-md absolute inset-y-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900">
                <span class="icon-[material-symbols--security]"></span>
              </div>
            </div>
          </div>
          <!-- ./ Input Name -->

          <!-- Input Email -->
          <div class="flex flex-col gap-y-1.5">
            <div class="relative">
              <input id="my-input-text" type="email"
                class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:ring-2 focus:ring-blue-400 focus:outline-none focus:invalid:ring-red-900 disabled:border-gray-300 disabled:bg-gray-100"
                placeholder="Konfirmasi ulang PIN" />
              <div
                class="text-icon-md absolute inset-y-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900">
                <span class="icon-[material-symbols--security]"></span>
              </div>
            </div>
          </div>
          <!-- ./Input Email -->

          <!-- Button Action -->
          <button type="button"
            class="bg-brands-light-blue hover:bg-brands-dark-blue inline-flex items-center justify-center gap-2 rounded-xl p-2.5 text-sm text-white uppercase focus:ring-2 focus:ring-blue-400 focus:outline-none disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400">
            <span>Lanjutkan</span>
            <span class="icon-[material-symbols--chevron-right-rounded] text-icon-md"></span>
          </button>
          <!-- ./ Button Action -->

          <!-- Help Text -->
          <p class="mt-3 text-center text-xs text-neutral-400">
            Dengan masuk atau daftar, Anda sudah setuju dengan
            <a href="#"
              class="text-brands-light-blue hover:text-brands-light-blue/70 text-xs font-semibold focus:ring-2 focus:ring-blue-400 focus:outline-none">Ketentuan
              Layanan</a>
            dan
            <a href="#"
              class="text-brands-light-blue hover:text-brands-light-blue/70 text-xs font-semibold focus:ring-2 focus:ring-blue-400 focus:outline-none">Kebijakan
              Privasi</a>
            SAKUKU
          </p>
          <!-- ./Help Text -->
        </form>
        <!-- ./ Form -->
      </div>
    </div>
  </div>
</body>

</html>

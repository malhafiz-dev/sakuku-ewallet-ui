<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="../assets/css/main.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Red+Rose:wght@300..700&display=swap"
    rel="stylesheet" />
  <link rel="shortcut icon" href="../assets/images/wallet-white.png" type="image/x-icon" />
  <title>Account Settings</title>
</head>

<body>
  <div class="container mx-auto max-w-3xl">
    <!-- App Bar -->
    <div class="fixed top-0 left-0 z-10 flex w-full items-center gap-5 bg-white p-4 text-gray-900">
      <a href="index2.html" class="hover:text-gray-400 focus:ring-2 focus:ring-blue-400 focus:outline-none"
        onclick="history.back()" aria-label="Kembali">
        <span class="icon-[formkit--arrowleft] text-icon-md block"></span>
      </a>
      <p class="text-lg font-semibold">Pengaturan Akun</p>
    </div>
    <!-- ./ App Bar -->

    <div class="flex min-h-dvh flex-col gap-4 bg-blue-50 pb-20">
      <div class="mt-23 flex w-full flex-col gap-8 p-4">
        <!-- Card Informasi Personal -->
        <form action="#" method="post" class="flex flex-col gap-4 rounded-[20px] bg-white p-2.5 shadow-md">
          <!-- Title -->
          <div class="mb-6 ps-4 text-xl font-semibold text-gray-900">
            Informasi Personal
          </div>
          <!-- ./ Title -->

          <!-- Input File -->
          <div class="mb-6 flex justify-center">
            <label for="file-upload" class="cursor-pointer">
              <div class="flex size-25 items-center justify-center rounded-full bg-gray-300 hover:opacity-70">
                <span class="icon-[material-symbols--upload-rounded] text-icon-xl text-gray-900"></span>
              </div>
              <input id="file-upload" type="file" class="hidden" />
            </label>
          </div>
          <!-- ./ Input File -->

          <!-- Input Name -->
          <div class="flex flex-col gap-y-1.5">
            <label for="input-nama" class="ps-4 text-sm font-medium text-gray-900 uppercase">Nama</label>
            <div class="relative">
              <input id="input-nama" type="text"
                class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:ring-2 focus:ring-blue-400 focus:outline-none focus:invalid:ring-red-900 disabled:border-gray-300 disabled:bg-gray-100"
                placeholder="Masukkan Nama" />
              <div
                class="text-icon-md absolute inset-y-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900">
                <span class="icon-[material-symbols--person-rounded]"></span>
              </div>
            </div>
          </div>
          <!-- ./ Input Name -->

          <!-- Input Email -->
          <div class="flex flex-col gap-y-1.5">
            <label for="input-email" class="ps-4 text-sm font-medium text-gray-900 uppercase">Email</label>
            <div class="relative">
              <input id="input-email" type="email"
                class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:ring-2 focus:ring-blue-400 focus:outline-none focus:invalid:ring-red-900 disabled:border-gray-300 disabled:bg-gray-100"
                placeholder="Masukkan Email" />
              <div
                class="text-icon-md absolute inset-y-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900">
                <span class="icon-[material-symbols--mail-rounded]"></span>
              </div>
            </div>
          </div>
          <!-- ./ Input Email -->

          <!-- Button -->
          <button type="button"
            class="hover:bg-brands-light-blue text-brands-light-blue border-brands-light-blue mt-6 inline-flex items-center justify-center gap-2 rounded-xl border-2 bg-transparent p-2.5 text-sm uppercase hover:text-white focus:ring-2 focus:ring-blue-400 focus:outline-none disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-transparent disabled:text-gray-400">
            <span class="icon-[material-symbols--save-rounded] text-icon-md"></span>
            <span>Simpan Perubahan</span>
          </button>
          <!-- ./ Button -->
        </form>
        <!-- ./ Card Informasi Personal -->

        <!-- Card Keamanan PIN -->
        <form action="#" method="post" class="flex flex-col gap-4 rounded-[20px] bg-white p-2.5 shadow-md">
          <!-- Title -->
          <div class="mb-6 ps-4 text-xl font-semibold text-gray-900">
            Keamanan PIN
          </div>
          <!-- ./ Title -->

          <!-- Input PIN Lama -->
          <div class="flex flex-col gap-y-1.5">
            <label for="input-pin-lama" class="ps-4 text-sm font-medium text-gray-900 uppercase">PIN Lama</label>
            <div class="relative">
              <input id="input-pin-lama" type="text"
                class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:ring-2 focus:ring-blue-400 focus:outline-none focus:invalid:ring-red-900 disabled:border-gray-300 disabled:bg-gray-100"
                placeholder="Masukkan 6 digit PIN lama" />
              <div
                class="text-icon-md absolute inset-y-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900">
                <span class="icon-[material-symbols--security-rounded]"></span>
              </div>
            </div>
          </div>
          <!-- ./ Input PIN Lama -->

          <!-- Input PIN Baru -->
          <div class="flex flex-col gap-y-1.5">
            <label for="input-pin-baru" class="ps-4 text-sm font-medium text-gray-900 uppercase">PIN Baru</label>
            <div class="relative">
              <input id="input-pin-baru" type="text"
                class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:ring-2 focus:ring-blue-400 focus:outline-none focus:invalid:ring-red-900 disabled:border-gray-300 disabled:bg-gray-100"
                placeholder="Buat 6 digit PIN baru" />
              <div
                class="text-icon-md absolute inset-y-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900">
                <span class="icon-[material-symbols--security-rounded]"></span>
              </div>
            </div>
          </div>
          <!-- ./ Input PIN Baru -->

          <!-- Input Konfirmasi PIN -->
          <div class="flex flex-col gap-y-1.5">
            <label for="input-konfirmasi-pin" class="ps-4 text-sm font-medium text-gray-900 uppercase">Konfirmasi
              PIN</label>
            <div class="relative">
              <input id="input-konfirmasi-pin" type="text"
                class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:ring-2 focus:ring-blue-400 focus:outline-none focus:invalid:ring-red-900 disabled:border-gray-300 disabled:bg-gray-100"
                placeholder="Konfirmasi 6 digit PIN baru" />
              <div
                class="text-icon-md absolute inset-y-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900">
                <span class="icon-[material-symbols--security-rounded]"></span>
              </div>
            </div>
          </div>
          <!-- ./ Input PIN Baru -->

          <!-- Button -->
          <button type="button"
            class="hover:bg-brands-light-blue text-brands-light-blue border-brands-light-blue mt-6 inline-flex items-center justify-center gap-2 rounded-xl border-2 bg-transparent p-2.5 text-sm uppercase hover:text-white focus:ring-2 focus:ring-blue-400 focus:outline-none disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-transparent disabled:text-gray-400">
            <span class="icon-[material-symbols--save-rounded] text-icon-md"></span>
            <span>Simpan Perubahan</span>
          </button>
          <!-- ./ Button -->
        </form>
        <!-- ./ Card Keamanan PIN -->

        <!-- Card Penarikan Dana -->
        <form action="#" method="post" class="flex flex-col gap-4 rounded-[20px] bg-white p-2.5 shadow-md">
          <!-- Title -->
          <div class="mb-6 ps-4 text-xl font-semibold text-gray-900">
            Penarikan Dana
          </div>
          <!-- ./ Title -->

          <!-- Pilih Bank -->
          <div class="flex flex-col gap-y-1.5">
            <label for="pilih-bank" class="ps-4 text-sm font-medium text-gray-900 uppercase">Pilih Bank</label>
            <div class="relative">
              <input id="pilih-bank" type="text"
                class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:ring-2 focus:ring-blue-400 focus:outline-none focus:invalid:ring-red-900 disabled:border-gray-300 disabled:bg-gray-100"
                placeholder="Pilih Bank" />
              <div
                class="text-icon-md absolute inset-y-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900">
                <span class="icon-[mdi--bank]"></span>
              </div>
              <div
                class="text-icon-md absolute inset-y-0 inset-e-0 flex items-center pe-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900">
                <span class="icon-[material-symbols--keyboard-arrow-down]"></span>
              </div>
            </div>
          </div>
          <!-- ./ Pilih Bank -->

          <!-- Pilih Nama di Rekening -->
          <div class="flex flex-col gap-y-1.5">
            <label for="input-email" class="ps-4 text-sm font-medium text-gray-900 uppercase">Nama di Rekening</label>
            <div class="relative">
              <input id="input-email" type="email"
                class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:ring-2 focus:ring-blue-400 focus:outline-none focus:invalid:ring-red-900 disabled:border-gray-300 disabled:bg-gray-100"
                placeholder="Masukkan nama pemilik rekening" />
              <div
                class="text-icon-md absolute inset-y-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900">
                <span class="icon-[material-symbols--person-rounded]"></span>
              </div>
            </div>
          </div>
          <!-- ./ Pilih Nama di Rekening -->

          <!-- No. Rekening -->
          <div class="flex flex-col gap-y-1.5">
            <label for="pilih-no-rekening" class="ps-4 text-sm font-medium text-gray-900 uppercase">No. Rekening</label>
            <div class="relative">
              <input id="pilih-no-rekening" type="text"
                class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:ring-2 focus:ring-blue-400 focus:outline-none focus:invalid:ring-red-900 disabled:border-gray-300 disabled:bg-gray-100"
                placeholder="Masukkan No. Rekening" />
              <div
                class="text-icon-md absolute inset-y-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900">
                <span class="icon-[mdi--wallet]"></span>
              </div>
            </div>
          </div>
          <!-- ./ No. Rekekning -->

          <!-- Button -->
          <button type="button"
            class="hover:bg-brands-light-blue text-brands-light-blue border-brands-light-blue inline-flex items-center justify-center gap-2 rounded-xl border-2 bg-transparent p-2.5 text-sm uppercase hover:text-white focus:ring-2 focus:ring-blue-400 focus:outline-none disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-transparent disabled:text-gray-400">
            <span class="icon-[material-symbols--save-rounded] text-icon-md"></span>
            <span>Simpan Perubahan</span>
          </button>
          <!-- ./ Button -->
        </form>
        <!-- ./ Card Penarikan Dana -->
      </div>
    </div>

    <!-- Navbar -->
    <div class="fixed bottom-0 left-0 z-10 flex w-full justify-evenly bg-white">
      <a href="#" class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50">
        <span class="icon-[material-symbols--home-outline] text-icon-md inline group-hover:hidden"></span>
        <span class="icon-[material-symbols--home] text-icon-md hidden group-hover:inline"></span>
        <span class="text-xs font-semibold">Beranda</span>
      </a>
      <a href="#" class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50">
        <span class="icon-[material-symbols--receipt-outline-rounded] text-icon-md inline group-hover:hidden"></span>
        <span class="icon-[material-symbols--receipt-rounded] text-icon-md hidden group-hover:inline"></span>
        <span class="text-xs font-semibold">Riwayat</span>
      </a>
      <a href="#" class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50">
        <span class="icon-[material-symbols--person-outline] text-icon-md inline group-hover:hidden"></span>
        <span class="icon-[material-symbols--person] text-icon-md hidden group-hover:inline"></span>
        <span class="text-xs font-semibold">Akun</span>
      </a>
    </div>
    <!-- ./ Navbar -->
  </div>
</body>

</html>
